<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أكاديمية محمد المتقدم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --glass: rgba(0, 15, 20, 0.85);
        }

        body {
            background: #000 url('https://raw.githubusercontent.com/mohkori50-droid/-/main/image_1cc88b.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* تأثير التعتيم فوق السيرفرات لزيادة الفخامة */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, black 120%);
            z-index: -1;
        }

        .container {
            padding-top: 80px;
            perspective: 1200px; /* لعمل تأثير الشاشات المائلة */
        }

        /* صندوق العنوان - تصميم زجاجي متوهج */
        .header-panel {
            background: var(--glass);
            border: 2px solid var(--neon);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px var(--neon), inset 0 0 20px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(15px);
            margin-bottom: 50px;
            transform: rotateX(10deg); /* إمالة احترافية */
        }

        .neon-title {
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            font-weight: 900;
            font-size: 3.5rem;
        }

        /* كروت الكورسات - شاشات هكر عائمة */
        .cyber-card {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--neon);
            border-radius: 12px;
            padding: 0;
            transition: 0.5s;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .cyber-card:hover {
            transform: translateY(-15px) rotateY(-5deg);
            box-shadow: 0 0 40px var(--neon);
        }

        .card-header-blue {
            background: #007bff;
            color: white;
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-action {
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 10px;
            width: 80%;
            margin: 20px auto;
            display: block;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--neon);
        }

        .btn-action:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 25px var(--neon);
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <div class="header-panel">
        <h1 class="neon-title">أكاديمية محمد التقنية</h1>
        <p class="fs-4">نحن نكسر الحواجز الرقمية لنبني مستقبلاً أفضل</p>
        <div class="mt-3 small opacity-50">دخول لوحة التحكم ... جاري الاتصال بالسيرفر</div>
    </div>

    <div class="row g-5 justify-content-center">
        <div class="col-md-5">
            <div class="cyber-card">
                <div class="card-header-blue">SECURITY 01</div>
                <div class="p-4 text-center">
                    <p class="small opacity-75">جاري التحميل...</p>
                    <p>أساسيات حماية المواقع من هجمات الاختراق.</p>
                    <a href="#" class="btn-action">قريباً</a>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="cyber-card">
                <div class="p-4 text-center">
                    <h3 style="color: var(--neon); text-shadow: 0 0 10px var(--neon);">PROJECT: DJANGO</h3>
                    <p class="small text-success">الحالة: متصل</p>
                    <p>بناء الأنظمة الخلفية وإدارة قواعد البيانات.</p>
                    <a href="#" class="btn-action">تحميل البيانات</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

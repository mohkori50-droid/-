<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفخر يا جدك</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --glass: rgba(0, 15, 20, 0.85);
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- تأثير 1 و 0 (Matrix) --- */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* خلف كل شيء */
            opacity: 0.8; /* لضمان وضوح الأرقام */
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9));
            z-index: -1;
        }
        /* ------------------------- */

        .container {
            padding-top: 60px;
            perspective: 1200px;
        }

        .header-panel {
            background: var(--glass);
            border: 2px solid var(--neon);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px var(--neon), inset 0 0 20px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(15px);
            margin-bottom: 50px;
        }

        .neon-title {
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        .cyber-card {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--neon);
            border-radius: 12px;
            padding: 0;
            transition: 0.5s;
            overflow: hidden;
            height: 100%;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .cyber-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 0 40px var(--neon);
        }

        .card-header-cyan {
            background: #007bff;
            color: white;
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-action {
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 10px;
            width: 80%;
            margin: 20px auto;
            display: block;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--neon);
            text-align: center;
            font-weight: bold;
        }

        .btn-action:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 25px var(--neon);
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="overlay"></div>

<div class="container">
    <div class="header-panel">
        <h1 class="neon-title">الجيريان دمي حار ومنوليش اللور</h1>
        <p class="fs-4">نظام الدخول الرقمي | الحالة: نشط</p>
    </div>

    <div class="row g-4 justify-content-center">
        {% for course in courses %}
        <div class="col-md-6 col-lg-4">
            <div class="cyber-card">
                <div class="card-header-cyan">نظام: {{ course.title }}</div>
                <div class="p-4 text-center">
                    <p class="small text-info">الحالة: متصل | التشفير: نشط</p>
                    <p class="text-light opacity-75">{{ course.description|truncatechars:100 }}</p>
                    <a href="{% url 'course_detail' course.id %}" class="btn-action">فتح البيانات</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="text-center mt-5">
            <h3 class="text-warning">لا توجد دروس حالياً.</h3>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const characters = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = 1;
    }

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00f2ff'; // لون الأرقام (نفس لون النيون)
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(draw, 33);
</script>

</body>
</html>

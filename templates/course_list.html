<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجيريان دمي حار ومنوليش اللور | CORE SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --glass: rgba(0, 15, 20, 0.85);
        }

        body {
            background-color: #000; /* الأساس أسود */
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* حاوية الماتريكس - تأكدنا أنها في الخلفية تماماً */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* خلف المحتوى */
        }

        /* طبقة تظليل خفيفة لضمان قراءة النصوص */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 0;
            pointer-events: none; /* لا تعيق الضغط على الأزرار */
        }

        .navbar {
            background: rgba(0, 0, 0, 0.9) !important;
            border-bottom: 1px solid var(--neon);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .container {
            position: relative;
            z-index: 10; /* فوق الماتريكس */
            padding-top: 40px;
        }

        .header-panel {
            background: var(--glass);
            border: 2px solid var(--neon);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px var(--neon);
            backdrop-filter: blur(10px);
            margin-bottom: 50px;
        }

        .neon-title {
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            font-weight: 900;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }

        .cyber-card {
            background: rgba(0, 5, 10, 0.9);
            border: 1px solid var(--neon);
            border-radius: 12px;
            transition: 0.4s;
            height: 100%;
        }

        .cyber-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 30px var(--neon);
        }

        .card-header-cyan {
            background: #007bff;
            color: white;
            padding: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-action {
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-action:hover {
            background: var(--neon);
            color: #000;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="overlay"></div>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-info fw-bold" href="#">CORE-SYSTEM</a>
        <div class="ms-auto">
            <a href="/admin/" class="btn btn-outline-info btn-sm">لوحة التحكم</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="header-panel">
        <h1 class="neon-title">الجيريان دمي حار ومنوليش اللور</h1>
        <p class="fs-5 opacity-75 text-info">موقع مشفر</p>
    </div>

    <div class="row g-4 justify-content-center">
        {% for course in courses %}
        <div class="col-md-6 col-lg-4">
            <div class="cyber-card">
                <div class="card-header-cyan">NODE: {{ course.title }}</div>
                <div class="p-4 text-center">
                    <p class="text-light opacity-75 small">{{ course.description|truncatechars:100 }}</p>
                    <a href="{% url 'video_detail' course.id %}" class="btn-action">فتح البيانات</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    // تحديد أبعاد الكانفاس بملء الشاشة
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // الأرقام التي ستسقط
    const binary = "01";
    const fontSize = 18;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = [];

    // إعطاء كل عمود نقطة بداية عشوائية خارج الشاشة
    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
    }

    function draw() {
        // طبقة شفافة جداً لخلق تأثير "ذيل" للأرقام
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // لون الأرقام (النيون الأزرق)
        ctx.fillStyle = "#00f2ff"; 
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            // اختيار عشوائي بين 0 و 1
            const text = binary.charAt(Math.floor(Math.random() * binary.length));
            
            // رسم الرقم
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            // إذا وصل الرقم للقاع، يعود للأعلى باحتمالية معينة
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }

            drops[i]++;
        }
    }

    // تشغيل الأنيميشن بسرعة 30 إطار في الثانية
    setInterval(draw, 33);
</script>

</body>
</html>

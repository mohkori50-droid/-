<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.title }} | MOHAMED.SITE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --glass: rgba(0, 15, 20, 0.9); }
        body { background-color: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%); z-index: 0; pointer-events: none; }
        .navbar { background: rgba(0, 0, 0, 0.9) !important; border-bottom: 1px solid var(--neon); backdrop-filter: blur(10px); z-index: 1000; }
        .video-main-panel { background: var(--glass); border: 2px solid var(--neon); border-radius: 20px; padding: 25px; box-shadow: 0 0 25px rgba(0, 242, 255, 0.2); backdrop-filter: blur(15px); }
        .lesson-list-panel { background: rgba(0, 5, 10, 0.9); border: 1px solid var(--neon); border-radius: 15px; overflow: hidden; }
        .card-header-cyan { background: #007bff; color: white; padding: 12px; font-weight: bold; text-align: center; }
        .lesson-item { background: transparent; color: white; border: none; border-bottom: 1px solid rgba(0, 242, 255, 0.1); padding: 15px; width: 100%; text-align: right; transition: 0.3s; }
        .lesson-item:hover { background: rgba(0, 242, 255, 0.1); color: var(--neon); }
        .lesson-item.active { border-right: 4px solid var(--neon); background: rgba(0, 242, 255, 0.05); }
        iframe { border-radius: 12px; border: 1px solid rgba(0, 242, 255, 0.3); background: #000; }
        .neon-text { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="overlay"></div>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-info fw-bold" href="/">MOHAMED.SITE</a>
        <div class="ms-auto text-light opacity-50 small">الجيريان دمي حار ومنوليش اللور</div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="video-main-panel">
                <h2 class="neon-text mb-4" id="video-title">
                    {% if course.lessons.all %}{{ course.lessons.first.title }}{% else %}نظام مشفر: لا دروس{% endif %}
                </h2>
                {% if course.lessons.all %}
                <div class="ratio ratio-16x9">
                    <iframe id="main-video" src="about:blank" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>
                {% endif %}
            </div>
        </div>

        <div class="col-lg-4">
            <div class="lesson-list-panel">
                <div class="card-header-cyan">نظام الدروس (0-1)</div>
                <div style="max-height: 550px; overflow-y: auto;">
                    {% for lesson in course.lessons.all %}
                    <button class="lesson-item" onclick="changeVideo('{{ lesson.video_url|escapejs }}', '{{ lesson.title|escapejs }}', this)">
                        <span class="text-info me-2">#</span> {{ lesson.title }}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function getEmbedUrl(url) {
        if (!url) return "";
        let videoId = "";
        if (url.includes("v=")) videoId = url.split("v=")[1].split("&")[0];
        else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1];
        else if (url.includes("embed/")) return url;
        return videoId ? `https://www.youtube.com/embed/${videoId}?rel=0` : url;
    }

    function changeVideo(url, title, btn) {
        const iframe = document.getElementById('main-video');
        if (iframe) {
            iframe.src = getEmbedUrl(url);
            document.getElementById('video-title').innerText = title;
            document.querySelectorAll('.lesson-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        {% if course.lessons.all %}
            changeVideo('{{ course.lessons.first.video_url|escapejs }}', '{{ course.lessons.first.title|escapejs }}', document.querySelector('.lesson-item'));
        {% endif %}
    });

    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const columns = Math.floor(window.innerWidth / 18);
    const drops = Array(columns).fill(0).map(() => Math.random() * -100);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00f2ff"; ctx.font = "18px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random() * 2), i * 18, y * 18);
            if (y * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);
</script>
</body>
</html>

<div class="video-container" style="text-align: center; margin: 20px 0;">
    {% if course.lessons.all %}
        <iframe 
            width="800" 
            height="450" 
            src="{{ course.lessons.first.video_url }}" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen 
            style="border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
        </iframe>
    {% else %}
        <div style="padding: 50px; background: #eee; border-radius: 10px;">
            <h3>لا توجد دروس مضافة لهذا الكورس بعد.</h3>
        </div>
    {% endif %}
</div>

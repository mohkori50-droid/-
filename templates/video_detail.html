<div class="video-main-panel">
    <h2 class="neon-text mb-4" id="video-title">{{ course.lessons.first.title }}</h2>
    
    {% if course.lessons.all %}
    <div class="ratio ratio-16x9">
        <iframe 
            id="main-video" 
            src="{{ course.lessons.first.video_url }}" 
            allowfullscreen 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>
    {% endif %}
</div>

<script>
    function changeVideo(url, title, btn) {
        const iframe = document.getElementById('main-video');
        if (iframe) {
            // تحديث المصدر مباشرة بدون معالجة إضافية قد تكسر الرابط
            iframe.src = url; 
            document.getElementById('video-title').innerText = title;
            
            // تحديث شكل الأزرار
            document.querySelectorAll('.lesson-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
    }
</script>
